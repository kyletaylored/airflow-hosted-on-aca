name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt
          # openlineage-sql: the parser Airflow's OpenLineage provider uses, so the
          # contoso_dw lineage tests run instead of skipping (same version as the image).
          pip install pytest ruff openlineage-sql==1.55.0

      - name: Lint (ruff)
        run: ruff check airflow services tests

      - name: Run tests
        run: pytest

  bicep:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Bicep compiles
        run: az bicep build --file infra/main.bicep
